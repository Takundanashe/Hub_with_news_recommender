# /etc/nginx/sites-available/app.conf
# Serves the PHP app over HTTP(S) and reverse-proxies /ws to the
# Ratchet WebSocket process (see server/websocket/server.php).
#
# Install: sudo ln -s /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;                     # catch-all: responds on any hostname/IP it's reached by

    root /var/www/app/public;          # points at the public/ dir only - never the project root
    index index.php;

    # Never serve the SQLite DB, source SQL, or dotfiles even if someone
    # guesses the path - defense in depth on top of it living outside root.
    location ~ \.(sqlite|sqlite3|db|sql)$ { deny all; }
    location ~ /\. { deny all; }

    # Static assets
    location /assets/ {
        expires 7d;
        access_log off;
    }

    location /uploads/ {
        # Uploaded images only - never execute PHP from here even if
        # something slips past upload validation.
        location ~ \.php$ { deny all; }
    }

    # WebSocket upgrade -> Ratchet process on 8080
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;       # keep long-lived connections open
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-app.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    client_max_body_size 10M;          # allow image uploads through

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # CSP is intentionally NOT set here - it's emitted by includes/security.php
    # with a per-request nonce for the handful of inline bootstrap scripts.
    # Setting it again here with a different value would make the browser
    # enforce BOTH policies (CSPs combine restrictively), which would block
    # the nonce'd scripts since this static config can't know the nonce.
}
