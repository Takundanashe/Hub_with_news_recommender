; /etc/php/8.2/fpm/pool.d/app.conf
; A dedicated pool (rather than the default www pool) so this app's
; process limits and socket are isolated from anything else on the box.

[app]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-app.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Keep upload size in step with nginx's client_max_body_size (10M).
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M

; Never expose PHP version in response headers.
php_admin_flag[expose_php] = off

; Errors go to a log, never to the response body in a real deployment.
php_admin_value[display_errors] = off
php_admin_value[log_errors] = on
php_admin_value[error_log] = /var/www/app/logs/php-error.log

slowlog = /var/www/app/logs/php-slow.log
request_slowlog_timeout = 5s
